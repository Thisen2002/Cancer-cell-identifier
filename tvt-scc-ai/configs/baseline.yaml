# Baseline Model Configuration
model:
  name: "resnet50"
  pretrained: true
  num_classes: 2

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: "adamw"
  scheduler: "cosine"
  early_stopping_patience: 10

data:
  image_size: [224, 224]
  train_val_split: 0.8
  random_seed: 42
